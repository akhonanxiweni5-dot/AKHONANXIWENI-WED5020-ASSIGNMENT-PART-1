   <main>
<div>
            <h2>Book an Appointment Online</h2>
            <p>Please fill out the form below to request a booking slot at Akhona Clinic.</p>
            
            <form action="#" method="POST">
                <fieldset>
                    <legend>Appointment Booking Box</legend>
                    
                    <p>
                        <label for="fullname">Full Name:</label><br>
                        <input type="text" id="fullname" name="fullname" required>
                    </p>

                    <p>
                        <label for="email">Email Address:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="phone">Phone Number:</label><br>
                        <input type="tel" id="phone" name="phone" required>
                    </p>

                    <p>
                        <label for="service">Select Service:</label><br>
                        <select id="service" name="service">
                            <option value="general">General Consultation</option>
                            <option value="screening">Health Screening</option>
                            <option value="immunization">Immunization</option>
                            <option value="chronic">Chronic Care</option>
                        </select>
                    </p>

                    <p>
                        <label for="bdate">Preferred Date:</label><br>
                        <input type="date" id="bdate" name="bdate" required>
                    </p>

                    <p>
                        <button type="submit">Submit Booking</button>
                    </p>
                </fieldset>
            </form>
        </div>
   </main>
